<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-md">
            <div class="p-6">
                <div class="flex items-center">
                    <img src="https://img.icons8.com/color/48/000000/medical-doctor.png" alt="Logo" class="h-10 w-10">
                    <div class="ml-3">
                        <h1 class="text-xl font-bold">Rural Health Connect</h1>
                        <p class="text-sm text-gray-500">Your Health Companion</p>
                    </div>
                </div>
            </div>
            <nav class="mt-6">
                <a href="index.html" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-200">
                    <img src="https://img.icons8.com/ios-glyphs/30/000000/home.png" alt="Home" class="h-6 w-6">
                    <span class="mx-3">Home</span>
                </a>
                <a href="#" class="flex items-center px-6 py-3 text-gray-700 bg-gray-200">
                    <img src="https://img.icons8.com/ios-glyphs/30/000000/user.png" alt="Profile" class="h-6 w-6">
                    <span class="mx-3">Profile</span>
                </a>
                <a href="doctor.html" class="flex items-center px-6 py-3 text-gray-600 hover:bg-gray-200">
                    <img src="https://img.icons8.com/ios-glyphs/30/000000/medical-doctor.png" alt="Doctor View" class="h-6 w-6">
                    <span class="mx-3">Doctor View</span>
                </a>
            </nav>
            <div class="absolute bottom-0 left-0 w-64 p-6">
                <div class="flex items-center">
                    <div class="h-10 w-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">U</div>
                    <div class="ml-3">
                        <p class="text-sm font-semibold">User</p>
                        <p class="text-xs text-gray-500">Manage your health</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="flex-1 p-10">
            <div class="grid grid-cols-3 gap-8">
                <div class="col-span-2">
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h2 class="text-2xl font-bold mb-4">Personal Information</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="fullName" placeholder="Full Name" class="p-2 border rounded">
                            <input type="text" id="villageCity" placeholder="Enter village/city" class="p-2 border rounded">
                            <select id="gender" class="p-2 border rounded">
                                <option>Select gender</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                            <select id="languagePreference" class="p-2 border rounded">
                                <option>english</option>
                                <!-- Add other languages here -->
                            </select>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-md mt-8">
                        <h2 class="text-2xl font-bold mb-4"><span class="text-red-500">&#10084;</span> Health Information</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="bloodGroup" placeholder="e.g., O+" class="p-2 border rounded">
                            <input type="text" id="emergencyContactPhone" placeholder="+91 XXXXXXXXXX" class="p-2 border rounded">
                            <input type="text" id="emergencyContactName" placeholder="Contact name" class="p-2 border rounded col-span-2">
                            <textarea id="medicalConditions" placeholder="List any medical conditions" class="p-2 border rounded col-span-2"></textarea>
                            <textarea id="allergies" placeholder="List any allergies" class="p-2 border rounded col-span-2"></textarea>
                        </div>
                    </div>
                </div>
                <div class="bg-blue-500 text-white p-6 rounded-lg shadow-md">
                    <h2 class="text-2xl font-bold mb-4">Quick Stats</h2>
                    <div class="flex justify-between">
                        <span>Member since</span>
                        <span id="memberSince"></span>
                    </div>
                    <div class="flex justify-between mt-2">
                        <span>Health Records</span>
                        <span id="healthRecords"></span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="profile.js"></script>
</body>
</html>
